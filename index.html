<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Diario Arnie</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <h1>Diario delle arnie</h1>
        <p class="intro">Scegli l'arnia, tocca il giorno, scrivi. Si salva da solo.</p>
      </header>

      <div id="hives-grid" class="hives-grid" aria-label="Le tue arnie"></div>

      <section class="planner">
        <div class="planner-header">
          <h2 id="planner-title"></h2>
          <div class="month-controls">
            <button id="previous-month" type="button" aria-label="Mese precedente">&#8249;</button>
            <strong id="month-label"></strong>
            <button id="next-month" type="button" aria-label="Mese successivo">&#8250;</button>
          </div>
        </div>

        <div class="weekdays" aria-hidden="true">
          <span>Lun</span>
          <span>Mar</span>
          <span>Mer</span>
          <span>Gio</span>
          <span>Ven</span>
          <span>Sab</span>
          <span>Dom</span>
        </div>
        <div id="calendar-grid" class="calendar-grid"></div>

        <label id="note-label" class="note-label" for="note-text"></label>
        <textarea
          id="note-text"
          class="note-text"
          rows="5"
          placeholder="Cosa hai fatto? Es. controllo covata, nutrizione, melario..."
        ></textarea>
        <p id="save-status" class="save-status" role="status" aria-live="polite"></p>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
