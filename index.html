<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Diario Arnie</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <h1>Diario delle arnie</h1>
      </header>

      <div class="date-bar">
        <button id="previous-day" class="arrow" type="button" aria-label="Giorno precedente">
          &#8249;
        </button>
        <button
          id="open-calendar"
          class="date-display"
          type="button"
          aria-haspopup="dialog"
          aria-label="Apri il calendario per scegliere una data"
        >
          <strong id="date-main"></strong>
          <span id="today-badge" class="today-badge" hidden>Oggi</span>
        </button>
        <button id="next-day" class="arrow" type="button" aria-label="Giorno successivo">
          &#8250;
        </button>
      </div>

      <section id="hives-grid" class="hives-grid" aria-label="Le tue arnie"></section>
    </main>

    <dialog id="calendar-dialog" class="calendar-dialog" aria-label="Scegli una data">
      <div class="calendar-head">
        <button id="previous-month" class="arrow" type="button" aria-label="Mese precedente">
          &#8249;
        </button>
        <strong id="month-label"></strong>
        <button id="next-month" class="arrow" type="button" aria-label="Mese successivo">
          &#8250;
        </button>
      </div>

      <div class="weekdays" aria-hidden="true">
        <span>Lun</span>
        <span>Mar</span>
        <span>Mer</span>
        <span>Gio</span>
        <span>Ven</span>
        <span>Sab</span>
        <span>Dom</span>
      </div>

      <div id="calendar-grid" class="calendar-grid"></div>

      <div class="calendar-actions">
        <button id="go-today" class="ghost-button" type="button">Vai a oggi</button>
        <button id="close-calendar" class="ghost-button" type="button">Chiudi</button>
      </div>
    </dialog>

    <script src="app.js"></script>
  </body>
</html>
